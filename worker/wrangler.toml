# Renamed from startgrid-unsplash-proxy to startgrid-api-proxy in the
# Cloudflare dashboard to reflect that this Worker now proxies Unsplash,
# NASA, and the Google/MS OAuth token exchange, not just Unsplash. Renaming
# minted a new *.workers.dev URL — every reference to the old URL elsewhere
# in the repo (APP_MEDIA_PROXY_URL in .env/.env.example, docs/privacy.html)
# was updated alongside this rename.
name = "startgrid-api-proxy"
main = "api-proxy.ts"
compatibility_date = "2024-01-01"

# Per-IP rate limiting for the proxy routes (see checkRateLimit in
# api-proxy.ts). Create with `wrangler kv:namespace create RATE_LIMIT` and
# paste the returned id below before first deploy.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "b50c84c3250a404d91b8d7e7c164fd8d"

# Set secrets via:
#   wrangler secret put UNSPLASH_ACCESS_KEY
#   wrangler secret put NASA_API_KEY
#   wrangler secret put CARTO_API_KEY
#   wrangler secret put GOOGLE_CLIENT_ID
#   wrangler secret put GOOGLE_CLIENT_SECRET
#   wrangler secret put MS_CLIENT_ID
#   wrangler secret put MS_CLIENT_SECRET
# Optionally: wrangler secret put ALLOWED_ORIGIN
#   Comma-separated list of extra allowed origins, replacing the built-in
#   Chrome extension origin in api-proxy.ts (Firefox moz-extension:// origins
#   and the web origins listed there stay allowed either way). Needed if the
#   Chrome Web Store item's ID differs from the one the pinned signing key
#   produces — see the allowlist comment in api-proxy.ts.
